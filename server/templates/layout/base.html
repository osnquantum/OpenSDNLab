<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}OpenSDNLab{% endblock %}
    </title>

    <style>

        :root {
            --bg: #07111f;
            --bg-secondary: #0b1728;
            --panel: #101c2e;
            --panel-hover: #15243a;
            --border: #24354d;

            --text: #e6edf7;
            --muted: #8fa3bf;

            --primary: #38bdf8;
            --primary-dark: #0284c7;

            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;

            --sidebar-width: 260px;
        }


        * {
            box-sizing: border-box;
        }


        html {
            background: var(--bg);
        }


        body {

            margin: 0;

            min-height: 100vh;

            background:
                radial-gradient(
                    circle at top right,
                    rgba(14, 116, 144, 0.10),
                    transparent 35%
                ),
                var(--bg);

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

        }


        a {
            color: inherit;
        }


        .app-shell {

            min-height: 100vh;

        }


        .content {

            margin-left: var(--sidebar-width);

            min-height: 100vh;

            padding: 32px;

        }


        .page-header {

            display: flex;

            justify-content: space-between;

            align-items: flex-start;

            gap: 20px;

            margin-bottom: 28px;

        }


        .page-title {

            margin: 0;

            font-size: 28px;

            font-weight: 700;

            letter-spacing: -0.5px;

        }


        .page-subtitle {

            margin-top: 8px;

            color: var(--muted);

            font-size: 14px;

        }


        .top-status {

            display: flex;

            align-items: center;

            gap: 8px;

            color: var(--muted);

            font-size: 13px;

        }


        .status-dot {

            width: 9px;

            height: 9px;

            border-radius: 50%;

            background: var(--success);

            box-shadow:
                0 0 10px
                rgba(34, 197, 94, 0.8);

        }


        .mobile-toggle {

            display: none;

            position: fixed;

            top: 16px;

            left: 16px;

            z-index: 1001;

            width: 44px;

            height: 44px;

            border: 1px solid var(--border);

            border-radius: 10px;

            background: var(--panel);

            color: var(--text);

            font-size: 20px;

            cursor: pointer;

        }


        .card {

            background:
                linear-gradient(
                    180deg,
                    rgba(20, 34, 55, 0.96),
                    rgba(12, 24, 40, 0.96)
                );

            border:
                1px solid var(--border);

            border-radius: 14px;

            padding: 20px;

            box-shadow:
                0 12px 30px
                rgba(0, 0, 0, 0.15);

        }


        .grid {

            display: grid;

            grid-template-columns:
                repeat(
                    auto-fit,
                    minmax(180px, 1fr)
                );

            gap: 16px;

            margin: 20px 0;

        }


        .card h3 {

            margin-top: 0;

            color: var(--muted);

            font-size: 13px;

            font-weight: 500;

        }


        .value {

            color: var(--primary);

            font-size: 24px;

            font-weight: 700;

            word-break: break-word;

        }


        button,
        input,
        select,
        textarea {

            font:
                inherit;

        }


        button {

            transition:
                transform 0.15s ease,
                opacity 0.15s ease;

        }


        button:hover {

            transform:
                translateY(-1px);

        }


        @media (
            max-width: 900px
        ) {

            .content {

                margin-left: 0;

                padding:
                    76px 18px 24px;

            }


            .mobile-toggle {

                display: block;

            }


            .page-header {

                flex-direction: column;

            }

        }


        @media (
            max-width: 600px
        ) {

            .content {

                padding:
                    72px 14px 20px;

            }


            .page-title {

                font-size: 23px;

            }


            .grid {

                grid-template-columns:
                    1fr;

            }

        }

    </style>

    {% block extra_head %}
    {% endblock %}

</head>


<body>

    <div class="app-shell">

        <button
            class="mobile-toggle"
            id="mobileToggle"
            type="button"
            aria-label="Toggle navigation"
        >
            ☰
        </button>


        {% include "layout/sidebar.html" %}


        <main class="content">

            {% block content %}
            {% endblock %}

        </main>

    </div>


    <script>

        const mobileToggle =
            document.getElementById(
                "mobileToggle"
            );


        const sidebar =
            document.querySelector(
                ".sidebar"
            );


        if (
            mobileToggle &&
            sidebar
        ) {

            mobileToggle.addEventListener(
                "click",
                function() {

                    sidebar.classList.toggle(
                        "sidebar-open"
                    );

                }
            );

        }

    </script>

</body>

</html>

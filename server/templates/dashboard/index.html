<!DOCTYPE html>

<html>

<head>

<title>
OpenSDNLab Dashboard
</title>


<style>

body{
    font-family:Arial;
    margin:40px;
    background:#f5f5f5;
}


.card{

    background:white;
    padding:20px;
    margin:20px;
    border-radius:10px;

}


.value{

    font-size:22px;
    font-weight:bold;

}


button{

    padding:12px 25px;
    font-size:16px;

}

.grid{

    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;

}

</style>


</head>


<body>


<h1>
OpenSDNLab Live Monitoring
</h1>


<div class="card">

<h2>
Experiment Control
</h2>


<input id="expid"
value="EXP-20260808-0842bf"
size="30">


<button onclick="runExperiment()">
START
</button>


</div>



<div class="grid">


<div class="card">

<h3>Status</h3>

<div id="status" class="value">
-
</div>

</div>



<div class="card">

<h3>Stage</h3>

<div id="stage" class="value">
-
</div>

</div>



<div class="card">

<h3>Experiment</h3>

<div id="experiment" class="value">
-
</div>

</div>



<div class="card">

<h3>Hosts</h3>

<div id="hosts" class="value">
-
</div>

</div>



<div class="card">

<h3>Switches</h3>

<div id="switches" class="value">
-
</div>

</div>



<div class="card">

<h3>Elapsed</h3>

<div id="elapsed" class="value">
-
</div>

</div>



</div>




<div class="card">

<h2>
Latest Metrics
</h2>


<p>
RTT:
<b id="rtt">-</b>
ms
</p>


<p>
Jitter:
<b id="jitter">-</b>
ms
</p>


<p>
Throughput:
<b id="throughput">-</b>
Mbps
</p>


<p>
Packet Loss:
<b id="loss">-</b>
%
</p>


</div>



<script>


function runExperiment(){


let id=document.getElementById(
"expid"
).value;


fetch(
"/api/dashboard/run/"+id,
{
method:"POST"
}
);


}



function update(){


fetch(
"/api/dashboard/live"
)

.then(
r=>r.json()
)

.then(
data=>{


document.getElementById(
"status"
).innerHTML=data.status;


document.getElementById(
"stage"
).innerHTML=data.stage || "-";


document.getElementById(
"experiment"
).innerHTML=data.experiment_id || "-";


document.getElementById(
"hosts"
).innerHTML=data.hosts;


document.getElementById(
"switches"
).innerHTML=data.switches;


document.getElementById(
"elapsed"
).innerHTML=data.elapsed_seconds || 0;



let m=data.metrics || {};


document.getElementById(
"rtt"
).innerHTML=m.average_rtt || 0;


document.getElementById(
"jitter"
).innerHTML=m.jitter || 0;


document.getElementById(
"throughput"
).innerHTML=m.throughput || 0;


document.getElementById(
"loss"
).innerHTML=m.packet_loss || 0;


}

);


}



setInterval(
update,
2000
);


update();


</script>


</body>

</html>

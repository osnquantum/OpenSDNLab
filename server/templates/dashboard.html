<!DOCTYPE html>

<html>

<head>

<title>OpenSDNLab</title>

<style>

body{
font-family:Arial;
background:#111827;
color:white;
}


.card{

background:#1f2937;
padding:20px;
margin:15px;
border-radius:10px;

}


.grid{

display:grid;
grid-template-columns:repeat(3,1fr);

}


.green{
color:#22c55e;
}


</style>

</head>


<body>


<h1>
OpenSDN Dashboard
</h1>


<div class="grid">


<div class="card">

<h3>Controller</h3>

<p class="green">
🟢 Connected
</p>

</div>


<div class="card">

<h3>Mininet</h3>

<p class="green">
🟢 Running
</p>

</div>


<div class="card">

<h3>Database</h3>

<p class="green">
🟢 Healthy
</p>

</div>


</div>



<div class="card">

<h2>
Active Experiment
</h2>


<h3>
{{data.experiment_name}}
</h3>


<p>
Progress:
</p>


<progress value="70" max="100"></progress>


<p>
Run 73 / 100
</p>


</div>



<div class="card">


<h2>
Live Metrics
</h2>


<table>

<tr>
<td>RTT</td>
<td>{{data.average_rtt}} ms</td>
</tr>


<tr>
<td>Throughput</td>
<td>{{data.throughput}} Mbps</td>
</tr>


<tr>
<td>Jitter</td>
<td>{{data.jitter}} ms</td>
</tr>


<tr>
<td>Packet Loss</td>
<td>{{data.packet_loss}} %</td>
</tr>


</table>


</div>


</body>

</html>

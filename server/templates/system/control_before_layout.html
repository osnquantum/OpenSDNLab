<!DOCTYPE html>
<html>

<head>

<title>OpenSDNLab Controller Center</title>

<style>

body{
background:#08111f;
color:#e5e7eb;
font-family:Consolas,monospace;
margin:30px;
}

h1{
color:#38bdf8;
}

.grid{
display:grid;
grid-template-columns:40% 60%;
gap:20px;
}

.card{
background:#111827;
border:1px solid #334155;
border-radius:12px;
padding:20px;
margin-bottom:15px;
}

.controller{
border-left:5px solid #64748b;
padding:15px;
margin:10px;
}

.active{
border-left-color:#22c55e;
}

button{
padding:8px 15px;
margin:5px;
border:0;
border-radius:6px;
background:#2563eb;
color:white;
cursor:pointer;
}

button:hover{
background:#38bdf8;
}

.terminal{

background:#000;
height:450px;
overflow:auto;
padding:15px;
color:#22c55e;
border-radius:10px;
font-size:14px;

}


.log{

margin:4px 0;

}


.info{

color:#38bdf8;

}


.success{

color:#22c55e;

}


.error{

color:#ef4444;

}


.warning{

color:#facc15;

}

</style>

</head>


<body>


<h1>
⚡ OpenSDNLab Controller Control
</h1>


<div class="grid">


<div class="card">

<h2>
Controllers
</h2>


<div id="controllers">
Loading...
</div>


</div>



<div class="card">


<h2>
Live Operations Terminal
</h2>

<button onclick="clearTerminal()">
CLEAR VIEW
</button>


<div id="terminal" class="terminal">

</div>


</div>


</div>




<script>


function loadControllers(){


fetch("/api/controllers")

.then(r=>r.json())

.then(data=>{


let html="";


data.forEach(c=>{


let running =
c.status.running === true;



html += `

<div class="controller ${running?'active':''}">


<h3>

${running?'🟢':'🔴'}

${c.name}

</h3>


<p>

Status:

${running?'ACTIVE':'STOPPED'}

</p>


<pre>
${JSON.stringify(c.status,null,2)}
</pre>



${
running

?

`
<button onclick="action('${c.name}','stop')">
STOP
</button>
`

:

`
<button onclick="action('${c.name}','start')">
ACTIVATE
</button>
`

}



</div>

`;

});


document.getElementById(
"controllers"
).innerHTML=html;


});


}




function action(name,cmd){


fetch(
"/api/controllers/"+name+"/"+cmd,
{
method:"POST"
}
)

.then(()=>{

loadControllers();

loadLogs();

});


}




function clearTerminal(){

document.getElementById(
"terminal"
).innerHTML="";

}


function loadLogs(){


fetch("/api/controllers/active")

.then(r=>r.json())

.then(active=>{


if(!active.active){

document.getElementById(
"terminal"
).innerHTML="No active controller";

return;

}


fetch(
"/api/controllers/"
+ active.active
+ "/live-logs"
)

.then(r=>r.json())

.then(data=>{


let html="";


data.forEach(l=>{


let level="info";


let msg=l.message.toLowerCase();


if(
msg.includes("started") ||
msg.includes("ready") ||
msg.includes("instantiating")
)
{
level="success";
}


if(msg.includes("stop"))
{
level="warning";
}


if(
msg.includes("error") ||
msg.includes("failed")
)
{
level="error";
}


html +=

`
<div class="log ${level}">
[${l.source}]
${l.time}
${l.message}
</div>
`;

});


let terminal=document.getElementById(
"terminal"
);


terminal.innerHTML=html;


terminal.scrollTop=
terminal.scrollHeight;


});


});


}



loadControllers();

loadLogs();


setInterval(
loadControllers,
5000
);


setInterval(
loadLogs,
2000
);


</script>


</body>

</html>
